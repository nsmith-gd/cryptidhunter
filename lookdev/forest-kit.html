<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Forest Kit Lookdev</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0b0f12; overflow: hidden; font-family: monospace; color: #cfd6c8; }
    canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; }
    #label { position: fixed; left: 10px; top: 8px; font-size: 12px; text-shadow: 0 0 2px #000; }
  </style>
</head>
<body>
  <div id="label">Pine Hollow forest kit · drag to orbit · ?light=night|dusk</div>
  <script type="module">
    // Lineup of every forest-kit variant on a patch of floor, rendered with the game's pixel
    // upscale. Run with the dev server: npx vite, then open /lookdev/forest-kit.html
    import * as THREE from 'three';
    import { ForestKit } from '/src/art/forestKit.js';

    const PIXEL_SCALE = 3;
    const params = new URLSearchParams(location.search);
    const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    document.body.prepend(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);

    const mode = params.get('light') ?? 'dusk';
    const dusk = mode === 'dusk';
    scene.background = new THREE.Color(dusk ? 0x2a3442 : 0x0e1620);
    scene.fog = new THREE.FogExp2(scene.background, dusk ? 0.006 : 0.012);
    scene.add(new THREE.HemisphereLight(dusk ? 0x8aa0c0 : 0x34476a, 0x1a1810, dusk ? 1.1 : 0.75));
    const sun = new THREE.DirectionalLight(dusk ? 0xffc38a : 0x9db4e8, dusk ? 2.6 : 0.9);
    sun.position.set(-30, dusk ? 22 : 40, 25);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 140 });
    sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
    scene.add(sun);

    const floor = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshStandardMaterial({ color: 0x2b3324, roughness: 1 }));
    floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

    const kit = new ForestKit(77);
    const rows = [
      // [prefix, spacing, scale fn]
      ['pine', 9, (k) => (k === 'pine:2' ? [5, 5, 5] : [14, 15, 14])],
      ['snag', 9, () => [13, 12, 13]],
      ['bush', 3.2, () => 1.2],
      ['fern', 2.6, () => 1.2],
      ['log', 0, null],
      ['rock', 3.6, (k) => (k === 'rock:4' ? 1 : 2)],
      ['grass', 1.6, () => 1.2],
    ];
    let z = -26;
    for (const [prefix, gap, scale] of rows) {
      const keys = kit.variants(prefix);
      if (prefix === 'log') {
        keys.forEach((k, i) => kit.add(k, -12 + i * 8, 0.32, z, 0.15 * (i % 2 ? 1 : -1), [6, 0.75, 0.75]));
        z += 5; continue;
      }
      keys.forEach((k, i) => kit.add(k, (i - (keys.length - 1) / 2) * gap, 0, z, 0.6 + i, scale(k)));
      if (prefix === 'pine' || prefix === 'snag') keys.forEach((k, i) => kit.add('litter:0', (i - (keys.length - 1) / 2) * gap, 0, z, i, [4, 1, 4]));
      z += prefix === 'pine' ? 12 : prefix === 'snag' ? 9 : 4.5;
    }
    const group = kit.build(scene);
    const swayer = group.children[0];
    swayer.onBeforeRender = () => { kit.wind.value = performance.now() / 1000; };

    let yaw = 0.35, pitch = 0.32, dist = 42;
    const target = new THREE.Vector3(0, 3, -4);
    const place = () => {
      camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
      camera.lookAt(target);
    };
    let drag = null;
    addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY]; });
    addEventListener('pointerup', () => { drag = null; });
    addEventListener('pointermove', (e) => { if (!drag) return; yaw -= (e.clientX - drag[0]) * 0.005; pitch = Math.min(1.3, Math.max(0.05, pitch + (e.clientY - drag[1]) * 0.004)); drag = [e.clientX, e.clientY]; });
    addEventListener('wheel', (e) => { dist = Math.min(120, Math.max(6, dist * (1 + Math.sign(e.deltaY) * 0.1))); });
    const resize = () => {
      renderer.setSize(Math.ceil(innerWidth / PIXEL_SCALE), Math.ceil(innerHeight / PIXEL_SCALE), false);
      camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    };
    addEventListener('resize', resize); resize();
    window.__lookdev = { camera, target, setView: (y, p, d, t) => { yaw = y; pitch = p; dist = d; if (t) target.set(...t); }, kit };
    renderer.setAnimationLoop(() => { place(); renderer.render(scene, camera); });
  </script>
</body>
</html>
